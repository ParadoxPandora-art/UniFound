<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<title>UniFound</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
	<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="lost">
	<header class="top">
		<a class="logo" href="index.html">UniFound</a>
		<nav class="nav">
			<a class="pill lf on" href="index.html"><img class="icon" src="assets/icons/nav-lost.svg" alt=""> LOST &amp; FOUND</a>
			<a class="pill rt" href="retrieved.html"><img class="icon" src="assets/icons/nav-retrieved.svg" alt=""> RETRIEVED</a>
		</nav>
	</header>

	<main>
		<div class="bar">
			<label class="search">
				<img class="icon" src="assets/icons/search.svg" alt="">
				<input type="search" placeholder="Search..." aria-label="Search items" autocomplete="off">
			</label>
			<select aria-label="Campus" autocomplete="off">
				<option selected>All Campuses</option>
				<option>Main Campus</option>
				<option>Arzadon Gym</option>
				<option>Fame Building</option>
			</select>
			<select aria-label="Month" autocomplete="off">
				<option selected>All Month</option>
				<option>January</option>
				<option>February</option>
				<option>March</option>
				<option>April</option>
				<option>May</option>
				<option>June</option>
				<option>July</option>
				<option>August</option>
				<option>September</option>
				<option>October</option>
				<option>November</option>
				<option>December</option>
			</select>
			<input class="year" type="number" min="2000" max="2100" step="1" placeholder="All Year" aria-label="Year" autocomplete="off">
		</div>
		<section class="grid"></section>
		<nav class="pager" aria-label="Pages"></nav>
	</main>
	<div id="details" class="overlay">
		<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="item-title">
			<a class="close" href="#" aria-label="Close"><img class="icon" src="assets/icons/close.svg" alt=""></a>
			<div class="gallery">
				<span class="count"></span>
				<div class="ph"></div>
				<button class="view" type="button" style="display:none">VIEW IMAGE</button>
			</div>
			<div class="info">
				<h2 id="item-title"><span></span></h2>
				<b>Item Description:</b>
				<p class="desc"></p>
				<div class="meta"></div>
				<div class="claim">
					<p>If you claim that this item is yours, please message or contact us at:</p>
					<div class="contact">
						<span><img class="icon" src="assets/icons/phone.svg" alt=""> (075) 523 2000</span>
						<a href="mailto:info@udd.edu.ph"><img class="icon" src="assets/icons/mail.svg" alt=""> info@udd.edu.ph</a>
						<a href="#"><img class="icon" src="assets/icons/messenger.svg" alt=""> Universidad de Dagupan</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="js/app.js?v=20261122m"></script>
</body>
</html>
